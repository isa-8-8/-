<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mi persona favorita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDEEF1;--ink:#8a4a57;--scrim:rgba(253,238,241,.88);--btn:#B5495B;--btn-t:#FFF7EA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1b20;--ink:#e9b9c4;--scrim:rgba(43,27,32,.88)}}
:root[data-theme="dark"]{--bg:#2b1b20;--ink:#e9b9c4;--scrim:rgba(43,27,32,.88)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Caveat','Segoe Script','Bradley Hand','Brush Script MT',cursive;overflow-x:hidden}
.decor{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{--w:min(88vw,520px);position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px}
.env{position:relative;width:var(--w);aspect-ratio:460/300;perspective:1400px;transition:margin-top 1s cubic-bezier(.3,.8,.3,1)}
.env.open{margin-top:calc(var(--w)*.23)}
.env>*{position:absolute}
.back{inset:0;background:#FFF7EA;border-radius:6px;box-shadow:6px 8px 0 rgba(235,203,210,.7)}
.peek{left:6%;right:6%;top:5%;bottom:4%;background:#FFFCF5;border:1px solid #EBD9D0;border-radius:3px;z-index:2;transition:transform 1s cubic-bezier(.3,.8,.3,1);
background-image:repeating-linear-gradient(transparent 0 17px,#F3E3E6 17px 18px)}
.front{inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.flap{left:0;top:0;width:100%;height:70%;transform-origin:top center;z-index:4;transition:transform .9s cubic-bezier(.4,.1,.2,1);pointer-events:none}
.flap svg{width:100%;height:100%;display:block}
.to{left:0;right:0;bottom:7%;text-align:center;font-size:clamp(20px,5vw,30px);line-height:1.1;color:#B5495B;z-index:6;pointer-events:none}
.to i{display:block;font-style:normal;font-size:.6em;color:#E48A9C;margin-top:2px}
.seal{left:50%;top:70%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:7;border:0;padding:0;background:none;cursor:pointer;transition:transform .5s,opacity .5s;animation:beat 2.6s ease-in-out infinite}
.seal svg{width:100%;height:100%;display:block}
.seal:focus-visible{outline:2px solid #B5495B;outline-offset:4px;border-radius:50%}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
.open .seal{animation:none;transform:translate(-50%,-50%) scale(.5) rotate(18deg);opacity:0;pointer-events:none}
.open .flap{transform:rotateX(180deg)}
.open.behind .flap{z-index:1;transform:rotateX(180deg) scaleY(.5)}
.open .peek{cursor:pointer}
.hint{margin:0;font-size:clamp(20px,4.6vw,26px);text-align:center;min-height:1.3em}
.link{background:none;border:0;color:var(--ink);font:inherit;font-size:20px;text-decoration:underline;cursor:pointer;padding:4px 8px}
.read{position:fixed;inset:0;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .6s;z-index:20}
.read.show{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(100%,460px);max-height:100%;overflow-y:auto;box-sizing:border-box;padding:30px 28px 22px;background:#FFFBF2;border-radius:6px;color:#6b3a43;
box-shadow:0 12px 30px rgba(181,73,91,.2);border:1px solid #F0DCD8;transform:translateY(34px) rotate(-1.2deg) scale(.96);transition:transform .8s cubic-bezier(.3,.8,.3,1);
background-image:repeating-linear-gradient(transparent 0 33px,#F6E4E6 33px 34px)}
.show .paper{transform:none}
.paper h1{margin:0 0 10px;font-size:34px;font-weight:600;color:#B5495B;line-height:1.1}
.paper p{margin:0 0 17px;font-size:25px;line-height:34px}
.paper .sig{text-align:right;color:#B5495B;margin-bottom:6px}
.paper .btn{display:block;margin:18px auto 0;background:var(--btn);color:var(--btn-t);border:0;border-radius:999px;padding:8px 22px;font:inherit;font-size:22px;cursor:pointer}
.paper .btn:focus-visible,.link:focus-visible{outline:2px solid #B5495B;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg class="decor" viewBox="0 0 680 680" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><path id="hr" d="M0 6 C-10 -2 -7 -10 0 -5 C7 -10 10 -2 0 6Z"/><g id="fl"><ellipse cx="0" cy="-7" rx="4.5" ry="6.5"/><ellipse cx="0" cy="-7" rx="4.5" ry="6.5" transform="rotate(72)"/><ellipse cx="0" cy="-7" rx="4.5" ry="6.5" transform="rotate(144)"/><ellipse cx="0" cy="-7" rx="4.5" ry="6.5" transform="rotate(216)"/><ellipse cx="0" cy="-7" rx="4.5" ry="6.5" transform="rotate(288)"/></g><path id="sp" d="M0-8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"/></defs>
<g fill="none" stroke="#E48A9C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#hr" transform="translate(70,90) scale(1.3) rotate(-12)"/><use href="#hr" transform="translate(610,100) scale(1) rotate(10)"/><use href="#hr" transform="translate(600,600) scale(1.2) rotate(8)"/><use href="#hr" transform="translate(60,590) scale(.9) rotate(-8)"/></g>
<g fill="#F4B6C2" stroke="#E595A6" stroke-width=".6"><use href="#fl" transform="translate(110,60) scale(.9)"/><use href="#fl" transform="translate(570,55) scale(.7) rotate(15)"/><use href="#fl" transform="translate(110,620) scale(.8) rotate(30)"/><use href="#fl" transform="translate(560,630) scale(.9)"/><use href="#hr" transform="translate(140,140) scale(.7)"/><use href="#hr" transform="translate(540,150) scale(.6)"/></g>
<g fill="#FBE3A8"><circle cx="110" cy="60" r="2.6"/><circle cx="570" cy="55" r="2.1"/><circle cx="110" cy="620" r="2.3"/><circle cx="560" cy="630" r="2.6"/></g>
<g fill="#E9B7A0"><use href="#sp" transform="translate(200,70) scale(.9)"/><use href="#sp" transform="translate(470,80) scale(.7)"/><use href="#sp" transform="translate(40,380) scale(.8)"/><use href="#sp" transform="translate(640,320) scale(.7)"/><use href="#sp" transform="translate(250,625) scale(.8)"/><use href="#sp" transform="translate(450,620) scale(.9)"/></g>
</svg>
<main>
<div class="env" id="env">
<div class="back"></div>
<div class="peek" id="peek"></div>
<svg class="front" viewBox="0 0 460 300" preserveAspectRatio="none" aria-hidden="true">
<polygon points="0,0 0,300 230,160" fill="#FBEBDD" stroke="#E8C9CD" stroke-width="1" vector-effect="non-scaling-stroke"/>
<polygon points="460,0 460,300 230,160" fill="#FBEBDD" stroke="#E8C9CD" stroke-width="1" vector-effect="non-scaling-stroke"/>
<polygon points="0,300 230,130 460,300" fill="#FDF1E6" stroke="#E8C9CD" stroke-width="1" vector-effect="non-scaling-stroke"/>
<rect x="12" y="12" width="436" height="276" rx="4" fill="none" stroke="#EDBFC9" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
</svg>
<div class="to">Para mi persona favorita<i>&#9829;</i></div>
<div class="flap" id="flap"><svg viewBox="0 0 460 210" preserveAspectRatio="none" aria-hidden="true">
<polygon points="0,8 460,8 230,210" fill="#E3BFC6" opacity=".5"/>
<polygon points="0,0 460,0 230,210" fill="#F9D9DF" stroke="#E5B0BC" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<g fill="#EBB1BF"><path transform="translate(140,60) scale(1.5)" d="M0 6 C-10 -2 -7 -10 0 -5 C7 -10 10 -2 0 6Z"/><path transform="translate(320,60) scale(1.5)" d="M0 6 C-10 -2 -7 -10 0 -5 C7 -10 10 -2 0 6Z"/></g>
</svg></div>
<button class="seal" id="seal" aria-label="Abrir el sobre">
<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 C66 3 86 10 92 28 C98 45 94 66 82 80 C70 94 50 99 33 93 C17 87 6 70 6 52 C6 26 26 5 50 4Z" fill="#E39AAE" stroke="#D17D94" stroke-width="2"/><circle cx="50" cy="50" r="34" fill="#EDB1C1" stroke="#D9849A" stroke-width="1.5" stroke-dasharray="4 4"/><path transform="translate(50,49) scale(2.1)" d="M0 6 C-10 -2 -7 -10 0 -5 C7 -10 10 -2 0 6Z" fill="#FBE3E9" stroke="#D9849A" stroke-width=".5"/></svg>
</button>
</div>
<p class="hint" id="hint">Toca el sello para abrir</p>
<button class="link" id="reset" hidden>Cerrar el sobre</button>
</main>
<div class="read" id="read" aria-hidden="true" role="dialog" aria-label="Carta">
<article class="paper" id="paper"></article>
</div>
<script>
var TITLE = 'Para mi mujer hermosa';
var PARAGRAPHS = [
  'Holaaaaa, mi niña hermosa. Hoy quería escribirte esta cartita para decirte cuánto te amo. ♥️,',
  'Agradezco mucho todo el amor, respeto, paciencia y alegría que compartes conmigo, amor. Aun a pesar de los días difíciles, siempre estás para mí. Valoro cada una de las cosas que haces por mí y las mil y un maneras en las que me haces feliz.',
  'Para mí, siempre serás una mujer muy maravillosa, una mujer única. Y la verdad, eres más hermosa que las estrellas en el cielo. Para mí, siempre serás la estrella y bendición más bonita que he visto en mi vida. ♥️💍',
  'Contigo, todo se hace más tranquilo, más bonito, y las partes pesadas del día se van cuando estoy contigo. 💍♥️',
  'Te amé mucho, te amo mucho y te amaré por toda la vida, mi hermosa mujer. ♥️💍'
];
var SIGNATURE = 'Con todo mi corazon';

var env = document.getElementById('env'), seal = document.getElementById('seal'),
    read = document.getElementById('read'), paper = document.getElementById('paper'),
    hint = document.getElementById('hint'), reset = document.getElementById('reset'),
    peek = document.getElementById('peek'), timers = [], isOpen = false;

(function build() {
  var h = document.createElement('h1'); h.textContent = TITLE; paper.appendChild(h);
  PARAGRAPHS.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; paper.appendChild(p); });
  var s = document.createElement('p'); s.className = 'sig'; s.textContent = SIGNATURE + ' ♥'; paper.appendChild(s);
  var b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = 'Guardar la carta';
  b.addEventListener('click', closeLetter); paper.appendChild(b);
})();

function showLetter() { read.classList.add('show'); read.setAttribute('aria-hidden', 'false'); paper.scrollTop = 0; }
function closeLetter() {
  read.classList.remove('show'); read.setAttribute('aria-hidden', 'true');
  hint.textContent = 'Toca la carta para leerla otra vez'; reset.hidden = false;
}
function openEnv() {
  if (isOpen) return; isOpen = true;
  env.classList.add('open'); hint.textContent = '';
  timers.push(setTimeout(function () { env.classList.add('behind'); }, 450));
  timers.push(setTimeout(showLetter, 1500));
}
function resetEnv() {
  timers.forEach(clearTimeout); timers = []; isOpen = false;
  env.classList.remove('behind');
  timers.push(setTimeout(function () { env.classList.remove('open'); }, 60));
  hint.textContent = 'Toca el sello para abrir'; reset.hidden = true;
}
seal.addEventListener('click', openEnv);
peek.addEventListener('click', function () { if (isOpen) showLetter(); });
reset.addEventListener('click', resetEnv);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && read.classList.contains('show')) closeLetter(); });
</script>
</body>
</html>
